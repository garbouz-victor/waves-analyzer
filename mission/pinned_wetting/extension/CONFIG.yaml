version: '1.0'
model_id: PW1_NAVIER_DECLARED_EXTENSION
authorization: explicit_user_message_following_no_slip_STOP
inherits: ../CONFIG.yaml
physical_model_label: DECLARED_EXTENSION — конечное скольжение Навье
slip_length_m: 0.50
slip_origin: agent_selected_illustrative_dimensionful_parameter_before_any_extension_run
slip_applies_to: [left, right]
slip_selection: one_quarter_vessel_width_macroscopic_example_not_material_fit_or_film_thickness
side_normal_velocity: zero
bottom_bc: no_slip
sigma_N_m: 0.0
