name: STEP 3A small FEniCSx checks

on:
  push:
    paths:
      - 'sloshing_visualization/src/sloshing/multiphase/**'
      - 'sloshing_visualization/configs/step3/**'
      - 'sloshing_visualization/configs/step3a1/**'
      - 'sloshing_visualization/configs/step3a2/**'
      - 'sloshing_visualization/docker/step3/**'
      - 'sloshing_visualization/scripts/step3*'
      - 'sloshing_visualization/tests/test_step3*'
      - '.github/workflows/step3.yml'
  pull_request:
    paths:
      - 'sloshing_visualization/src/sloshing/multiphase/**'
      - 'sloshing_visualization/configs/step3/**'
      - 'sloshing_visualization/configs/step3a1/**'
      - 'sloshing_visualization/configs/step3a2/**'
      - 'sloshing_visualization/docker/step3/**'
      - 'sloshing_visualization/scripts/step3*'
      - 'sloshing_visualization/tests/test_step3*'
      - '.github/workflows/step3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tiny-coupled-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sloshing_visualization
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t waves-step3:0.10.0 -f docker/step3/Dockerfile docker/step3
      - run: >-
          bash docker/step3/run.sh python3 -m pytest -q
          tests/test_step3_model.py tests/test_step3_interface.py tests/test_step3_fenicsx.py
          tests/test_step3a1_*.py
          tests/test_step3a2_*.py
          tests/test_step3a3_*.py
          tests/test_step3a4_*.py
          tests/test_step3a5_*.py
          tests/test_step3a6_*.py
          tests/test_step3a7_*.py
          tests/test_step3a8_*.py
          tests/test_step3a9_*.py
      # Tiny spectral/CH checks only; never the 96x48 scientific series in CI.
